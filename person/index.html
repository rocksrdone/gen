<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Person Profile</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/common.js"></script>
<style>
  .top { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .top .search { flex: 1; }
  .icon-btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); border-radius: 8px; padding: 7px 10px; cursor: pointer; font: inherit; }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .hero { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; }
  .hero h1 { font: 600 26px/1.15 var(--serif); margin: 0; letter-spacing: -.01em; }
  .hero .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .hero .links { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; font-size: 13px; }
  .vitals { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 12px; }
  .vital { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
  .vital .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }
  .vital .v { font: 500 15px/1.3 var(--serif); }
  .vital .p { font-size: 12px; color: var(--ink-2); }
  .check { margin-top: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
  .check.ok { background: var(--ok-bg); color: var(--ok); }
  .check.bad { background: var(--bad-bg); color: var(--bad); }
  .notes { margin-top: 10px; color: var(--ink-2); font-size: 13px; white-space: pre-wrap; }

  .grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; margin-top: 12px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  @media (max-width: 600px) { .brow, .axis { grid-template-columns: 105px 1fr !important; } }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .hero { grid-template-columns: 1fr; } .hero .links { align-items: flex-start; } }

  .fam { display: grid; grid-template-columns: 90px 1fr; gap: 8px 10px; align-items: start; }
  .fam .lbl { font-size: 12px; color: var(--ink-3); padding-top: 6px; }
  .fam .chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .tl { position: relative; margin-left: 6px; padding-left: 16px; border-left: 2px solid var(--line); }
  .tl-item { position: relative; padding: 4px 0 12px; }
  .tl-item::before { content: ""; position: absolute; left: -22px; top: 9px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }
  .tl-item.primary::before { background: var(--accent); }
  .tl-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .tl-date { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tl-q { font-family: var(--serif); font-style: italic; color: var(--ink); margin: 2px 0; }
  .tl-src { font-size: 12px; color: var(--ink-2); }

  .bchart { position: relative; padding-right: 16px; }
  .brow { display: grid; grid-template-columns: 150px 1fr; gap: 8px; align-items: center; height: 24px; }
  .brow .lab { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track { position: relative; height: 100%; }
  .bar { position: absolute; top: 7px; height: 10px; border-radius: 3px; background: var(--accent); opacity: .75; min-width: 3px; }
  .bar.conflict { background: var(--bad); }
  .overlap { position: absolute; top: 0; bottom: 0; background: var(--ok-bg); border-left: 1px dashed var(--ok); border-right: 1px dashed var(--ok); }
  .axis { display: grid; grid-template-columns: 150px 1fr; gap: 8px; margin-top: 4px; }
  .axis .ticks { position: relative; height: 16px; border-top: 1px solid var(--line); }
  .axis .tick { position: absolute; top: 2px; transform: translateX(-50%); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .legend { font-size: 12px; color: var(--ink-2); margin-top: 6px; }

  .names { display: flex; flex-wrap: wrap; gap: 6px; }
  .name { background: var(--panel-2); border-radius: 6px; padding: 4px 8px; font-family: var(--serif); }
  .name .faint { font-family: var(--sans); font-size: 11px; }
  .item { padding: 7px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; padding-top: 0; }
  .item .t { font-weight: 500; }
  .item .d { font-size: 12px; color: var(--ink-2); }
  .row { display: flex; gap: 6px; align-items: baseline; justify-content: space-between; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="search" id="search"></div>
    <button class="icon-btn" id="refresh" title="Reload data">↻ Refresh</button>
  </div>
  <div id="app"><div class="loading">Loading…</div></div>
</div>
<script>
const TABLES = ['People', 'Relationships', 'Evidence', 'Sources', 'Names', 'Places', 'Searches',
  'Ancestry_Sync', 'Conclusions', 'DNA_Matches', 'DNA_Clusters', 'Stories', 'ToDo'];
let data = null, current = null, loadTimer = null;
const esc = FH.esc;

grist.ready({ requiredAccess: 'full', columns: [] });
FH.followTheme();
FH.personSearch(document.getElementById('search'), () => (data ? data.People : []), go);
document.getElementById('refresh').onclick = () => reload(true);

grist.onRecord(rec => {
  if (!rec) return;
  current = rec.id;
  reload();
});

function reload(now) {
  clearTimeout(loadTimer);
  loadTimer = setTimeout(async () => { data = await FH.load(TABLES); render(); }, now ? 0 : 120);
}

function go(id) {
  current = id;
  render();
  try { grist.setCursorPos({ rowId: id }); } catch (e) {}
}

function chip(id, extra) {
  const p = data.byId.People.get(id);
  if (!p) return '';
  return `<button class="chip ${FH.statusClass(p.Status)}" data-go="${id}" title="${esc(p.Status || '')}">
    ${esc(p.Name)} <span class="sub">${esc(FH.lifespan(p))}${extra ? ' · ' + esc(extra) : ''}</span></button>`;
}
function placeName(id) { const p = data.byId.Places.get(id); return p ? p.Name : ''; }
function srcLink(id) {
  const s = data.byId.Sources.get(id);
  if (!s) return '';
  const url = s.Image_URL || s.Record_URL;
  const lab = esc(s.Label || s.Code || s.Title);
  return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${lab}</a>` : lab;
}
function statusBadge(s) {
  const cls = { 'Proven': 'ok', 'Probable': 'warn', 'Hypothesis': 'hyp', 'Not this family': 'bad' }[s] || '';
  return s ? `<span class="badge ${cls}">${esc(s)}</span>` : '';
}
function section(title, n, body) {
  return `<div class="card"><div class="section-title">${esc(title)}${n != null ? `<span class="count">${n}</span>` : ''}</div>${body}</div>`;
}

function render() {
  const app = document.getElementById('app');
  if (!data) return;
  const p = data.byId.People.get(current) || data.People[0];
  if (!p) { app.innerHTML = '<div class="empty">No people yet.</div>'; return; }
  current = p.id;
  const fam = FH.family(data, p.id);
  const ev = data.Evidence.filter(e => e.Person === p.id)
    .sort((a, b) => (a.Record_Date || 0) - (b.Record_Date || 0));

  // Hero
  const check = p.Birth_Check || '';
  const hero = `<div class="card">
    <div class="hero">
      <div>
        <h1>${esc(p.Name)}</h1>
        <div class="meta">${statusBadge(p.Status)}
          ${p.Line ? `<span class="badge">${esc(p.Line)} line</span>` : ''}
          ${p.Sex && p.Sex !== '?' ? `<span class="badge">${p.Sex === 'F' ? 'Female' : 'Male'}</span>` : ''}
          ${p.Ancestry_Review ? `<span class="badge ${p.Ancestry_Review.startsWith('Done') ? 'ok' : 'warn'}">Ancestry: ${esc(p.Ancestry_Review)}</span>` : ''}
          ${p.Dead_Ends ? `<span class="badge">${p.Dead_Ends} dead end${p.Dead_Ends > 1 ? 's' : ''}</span>` : ''}
        </div>
      </div>
      <div class="links">
        ${p.FS_ID ? `<a href="https://www.familysearch.org/tree/person/details/${esc(p.FS_ID)}" target="_blank" rel="noopener">FamilySearch ${esc(p.FS_ID)} ↗</a>` : '<span class="faint">No FamilySearch ID</span>'}
        ${p.Ancestry_URL ? `<a href="${esc(p.Ancestry_URL)}" target="_blank" rel="noopener">Ancestry ↗</a>` : ''}
      </div>
    </div>
    <div class="vitals">
      <div class="vital"><div class="k">Born</div><div class="v">${esc(p.Born || '—')}</div><div class="p">${esc(placeName(p.Birth_Place))}</div></div>
      <div class="vital"><div class="k">Died</div><div class="v">${esc(p.Died || '—')}</div><div class="p">${esc(placeName(p.Death_Place))}</div></div>
    </div>
    ${check ? `<div class="check ${check.startsWith('OK') ? 'ok' : 'bad'}">${esc(check)}</div>` : ''}
    ${p.Notes ? `<div class="notes">${esc(p.Notes)}</div>` : ''}
  </div>`;

  // Family
  const famRow = (lbl, arr, extraFn) => arr.length ? `<div class="lbl">${lbl}</div><div class="chips">${arr.map(x => chip(x.id, extraFn && extraFn(x))).join('')}</div>` : '';
  const confNote = x => (x.conf && x.conf !== 'Proven' ? x.conf : '');
  const famHtml = famRow('Parents', fam.parents, confNote) + famRow('Spouses', fam.spouses, confNote)
    + famRow('Children', sortByBirth(fam.children), confNote) + famRow('Siblings', sortByBirth(fam.siblings))
    + famRow('Possibly same as', fam.related, confNote);
  const family = section('Family', null, famHtml ? `<div class="fam">${famHtml}</div>` : '<div class="empty">No relationships recorded.</div>');

  // Birth range chart
  const ranged = ev.filter(e => e.Born_From && e.Born_To);
  let chart = '';
  if (ranged.length) {
    const lo = Math.max(...ranged.map(e => FH.year(e.Born_From))), hi = Math.min(...ranged.map(e => FH.year(e.Born_To)));
    const minY = Math.floor(Math.min(...ranged.map(e => FH.year(e.Born_From))) - 1);
    const maxY = Math.ceil(Math.max(...ranged.map(e => FH.year(e.Born_To))) + 1);
    const pct = y => ((y - minY) / (maxY - minY) * 100).toFixed(2) + '%';
    const agree = lo <= hi;
    let step = (maxY - minY) > 16 ? 5 : (maxY - minY) > 8 ? 2 : 1;
    if (window.innerWidth < 600) step *= 2;
    const ticks = [];
    for (let y = Math.ceil(minY / step) * step; y <= maxY; y += step) ticks.push(`<span class="tick" style="left:${pct(y)}">${y}</span>`);
    const rows = ranged.map(e => {
      const a = FH.year(e.Born_From), b = FH.year(e.Born_To);
      const s = data.byId.Sources.get(e.Source);
      const outlier = !agree && (b < lo || a > hi);
      return `<div class="brow"><div class="lab" title="${esc(e.As_Written || '')}">${esc(s ? s.Code : '')} · age ${e.Age} in ${FH.toDate(e.Record_Date).getUTCFullYear()}</div>
        <div class="track">${agree ? `<div class="overlap" style="left:${pct(lo)};width:calc(${pct(hi)} - ${pct(lo)})"></div>` : ''}
        <div class="bar ${outlier ? 'conflict' : ''}" style="left:${pct(a)};width:calc(${pct(b)} - ${pct(a)})"></div></div></div>`;
    }).join('');
    chart = section('Birth year implied by stated ages', ranged.length,
      `<div class="bchart">${rows}<div class="axis"><div></div><div class="ticks">${ticks.join('')}</div></div></div>
       <div class="legend">${agree ? `All ages agree: born between <b>${FH.fmtDate(maxDate(ranged, 'Born_From'))}</b> and <b>${FH.fmtDate(minDate(ranged, 'Born_To'))}</b> (green band).`
        : 'The ages <b>don’t all agree</b>. Red bars fall outside the range the others share. Ages in old records are often off by a few years.'}</div>`);
  }

  // Timeline
  const tl = ev.length ? `<div class="tl">${ev.map(e => `<div class="tl-item ${e.Info_Type === 'Primary' ? 'primary' : ''}">
      <div class="tl-head"><span class="tl-date">${esc(FH.fmtDate(e.Record_Date) || 'Undated')}</span><span class="badge">${esc(e.Fact || '')}</span>
        ${e.Age != null ? `<span class="muted">age ${e.Age}</span>` : ''}${e.Place ? `<span class="muted">· ${esc(placeName(e.Place))}</span>` : ''}</div>
      ${e.As_Written ? `<div class="tl-q">“${esc(e.As_Written)}”</div>` : ''}
      <div class="tl-src">${srcLink(e.Source)}${e.Info_Type ? ` · ${esc(e.Info_Type)} info` : ''}${e.Notes ? ` · ${esc(e.Notes)}` : ''}</div>
    </div>`).join('')}</div>` : '<div class="empty">No evidence recorded yet.</div>';
  const timeline = section('Evidence timeline', ev.length, tl);

  // Right column
  const names = data.Names.filter(n => n.Person === p.id);
  const namesHtml = section('Name variants', names.length, names.length
    ? `<div class="names">${names.map(n => `<span class="name" title="${esc(n.Notes || '')}">${esc(n.Name_As_Written)} <span class="faint">${esc((data.byId.Sources.get(n.Source) || {}).Code || '')}</span></span>`).join('')}</div>`
    : '<div class="empty">None recorded.</div>');

  const cons = data.Conclusions.filter(c => FH.list(c.People).includes(p.id));
  const strengthCls = s => ({ 'Proven': 'ok', 'Very strong': 'ok', 'Strong': 'ok', 'Medium': 'warn', 'Unresolved': 'bad' }[s] || '');
  const consHtml = cons.length ? section('Conclusions', cons.length, cons.map(c => `<div class="item"><div class="row"><span class="t">${esc(c.Code)} · ${esc(c.Title)}</span><span class="badge ${strengthCls(c.Strength)}">${esc(c.Strength || '')}</span></div></div>`).join('')) : '';

  const todos = data.ToDo.filter(t => FH.list(t.People).includes(p.id) && t.Status !== 'Done');
  const todoHtml = todos.length ? section('Open questions', todos.length, todos.map(t => `<div class="item"><div class="row"><span class="t">${esc(t.Question)}</span><span class="badge ${t.Priority === 'High' ? 'bad' : t.Priority === 'Medium' ? 'warn' : ''}">${esc(t.Priority || '')}</span></div>${t.Next_Step ? `<div class="d">Next: ${esc(t.Next_Step)}</div>` : ''}</div>`).join('')) : '';

  const dead = data.Searches.filter(s => FH.list(s.People).includes(p.id) && s.Dead_End)
    .sort((a, b) => (b.Date_Searched || 0) - (a.Date_Searched || 0));
  const deadHtml = section('Dead ends', dead.length, dead.length ? dead.map(s => `<div class="item">
      <div class="t">${esc(s.Looking_For || s.Register)}</div>
      <div class="d">${esc([...new Set([s.Site, s.Register])].concat(s.Years && s.Years !== '?–?' ? [s.Years] : []).filter(x => x && !(x !== s.Site && s.Site && x.startsWith(s.Site))).join(' · '))}</div>
      <div class="d"><span class="badge">${esc(s.Result || '')}</span> ${s.Next_Try ? `<span class="badge warn">${esc(s.Next_Try)}</span>` : ''}</div></div>`).join('') : '<div class="empty">No dead ends logged.</div>');

  const anc = data.Ancestry_Sync.filter(a => a.Person === p.id);
  const ancHtml = anc.length ? section('Ancestry items', anc.length, anc.map(a => `<div class="item"><div class="row"><span class="t">${esc(a.Ancestry_Title || a.Item_Type)}</span><span class="badge ${a.Status === 'Fully extracted' || a.Status === 'Already had it' ? 'ok' : a.Status === 'To do' ? '' : 'warn'}">${esc(a.Status || '')}</span></div>
      <div class="d">${esc(a.Ancestry_Says || '')}${a.Open_Fix ? ' · <b>fix on Ancestry</b>' : ''} · ${esc(a.Checklist || '')}</div></div>`).join('')) : '';

  const dna = data.DNA_Matches.filter(m => m.Common_Ancestor === p.id);
  const dnaHtml = dna.length ? section('DNA matches through this person', dna.length, dna.map(m => `<div class="item"><div class="row"><span class="t">${esc(m.Match_Name)}</span><span class="muted">${m.Shared_cM || '?'} cM</span></div><div class="d">${esc(m.Possible_Relationships || '')}</div></div>`).join('')) : '';

  const stories = data.Stories.filter(s => FH.list(s.People).includes(p.id));
  const storyHtml = stories.length ? section('Family stories', stories.length, stories.map(s => `<div class="item"><div class="t" style="font-family:var(--serif)">${esc(s.Story)}</div><div class="d">${esc(s.Told_By || '')} · <span class="badge ${s.Verified === 'Supported' ? 'ok' : s.Verified === 'Contradicted' ? 'bad' : ''}">${esc(s.Verified || 'Unverified')}</span>${s.Notes ? ' · ' + esc(s.Notes) : ''}</div></div>`).join('')) : '';

  app.innerHTML = hero + `<div class="grid"><div class="col">${family}${chart}${timeline}</div>
    <div class="col">${namesHtml}${todoHtml}${consHtml}${deadHtml}${ancHtml}${dnaHtml}${storyHtml}</div></div>`;
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(+b.dataset.go));
}

function sortByBirth(arr) {
  const key = x => { const p = data.byId.People.get(x.id); const m = (p && p.Born || '').match(/\d{4}/); return m ? +m[0] : 9999; };
  return arr.slice().sort((a, b) => key(a) - key(b));
}
function maxDate(rows, k) { return rows.reduce((m, r) => (r[k] > m ? r[k] : m), rows[0][k]); }
function minDate(rows, k) { return rows.reduce((m, r) => (r[k] < m ? r[k] : m), rows[0][k]); }
</script>
</body>
</html>
